name: assemble-lock
on:
  push:
    paths:
      - .github/workflows/assemble-lock.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate lockfile slices
        run: |
          set -eu
          : > pnpm-lock.yaml
          for i in $(seq -w 0 24); do
            cat ".import-lock/$i" >> pnpm-lock.yaml
          done
          python3 - << 'PY'
          import hashlib, pathlib
          data = pathlib.Path("pnpm-lock.yaml").read_bytes()
          sha = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          expected = "1ee22f24b91fa16638550331e39c4c589fd35056"
          print(sha, len(data))
          if sha != expected or len(data) != 198577:
              raise SystemExit(1)
          PY
      - name: Commit assembled lockfile
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm -r .import-lock
          git rm .github/workflows/assemble-lock.yml
          git commit -m "Import Sawhorse, the local quoting desk."
          git push origin HEAD:master
